version: '3.8'

services:
  # Nginx Reverse Proxy (Entry Point)
  nginx:
    image: nginx:alpine
    container_name: exrt-ai-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Optional: SSL certificates for HTTPS
      # - ./certs:/etc/nginx/certs:ro
    depends_on:
      - streamlit
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - exrt-network

  # Streamlit Frontend Service
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: exrt-ai-streamlit
    expose:
      - "8501"
    environment:
      - Gemini_API_KEY=${Gemini_API_KEY}
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - BACKEND_API_URL=http://localhost/api
    volumes:
      # Mount local files for live development
      - ./app.py:/app/app.py
      - ./new_dashboard.html:/app/new_dashboard.html
      - ./analysis:/app/analysis
      - ./simulator:/app/simulator
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - exrt-network

  # FastAPI Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: exrt-ai-backend
    expose:
      - "8000"
    environment:
      - Gemini_API_KEY=${Gemini_API_KEY}
    volumes:
      # Mount files for live development
      - ./api_backup.py:/app/api_backup.py
      - ./analysis:/app/analysis
      - ./simulator:/app/simulator
    command: python api_backup.py
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - exrt-network

networks:
  exrt-network:
    driver: bridge
